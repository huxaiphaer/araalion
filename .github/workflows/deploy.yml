name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          BASE_PATH: /araalion   # GitHub Pages serves from /araalion; Coolify serves from /

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  coolify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check COOLIFY_TOKEN availability
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          echo "is the secret even defined in context? -> '${{ secrets.COOLIFY_TOKEN != '' }}'"
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "RESULT: ❌ EMPTY — secret is NOT reaching this job"
          else
            echo "RESULT: ✅ present"
            echo "length = ${#COOLIFY_TOKEN}  (should be 43)"
            echo "starts-with-17pipe = $(case "$COOLIFY_TOKEN" in 17\|*) echo yes;; *) echo no;; esac)"
          fi

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body -sS -X GET \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "https://coolify.pixsar.io/api/v1/deploy?uuid=xz2qjj60ha0wt5ktyj3dmiub&force=false"
